    <path d="M55 0h84l27 27h70" stroke-opacity=".5"/>
    <path d="M20 108h70l28-28h118" stroke-opacity=".18"/>
    <circle cx="0" cy="33" r="5" fill="#b8ff5c" stroke="none"/>
    <circle cx="55" cy="0" r="5" fill="#b8ff5c" stroke="none"/>
    <circle cx="20" cy="108" r="5" fill="#b8ff5c" stroke="none"/>
    <circle cx="236" cy="60" r="5" fill="#b8ff5c" stroke="none"/>
    <circle cx="236" cy="27" r="5" fill="#b8ff5c" stroke="none"/>
    <circle cx="236" cy="80" r="5" fill="#b8ff5c" stroke="none"/>
  </g>
