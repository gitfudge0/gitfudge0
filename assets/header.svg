<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Digvijay Mahapatra — gitfudge</title>
  <desc id="desc">Gen-AI and full-stack engineer. Procrastinating into production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="30%" r="65%">
      <stop offset="0" stop-color="#b8ff5c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b8ff5c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <g transform="translate(56 44)">
    <circle cx="8" cy="8" r="6" fill="#ff6b6b"/>
    <circle cx="30" cy="8" r="6" fill="#ffd166"/>
    <circle cx="52" cy="8" r="6" fill="#b8ff5c"/>
    <text x="1015" y="15" text-anchor="end" fill="#737b8c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">~/gitfudge</text>
  </g>

  <g transform="translate(64 112)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="0" y="0" fill="#b8ff5c" font-size="18" letter-spacing="3">DIGVIJAY MAHAPATRA</text>
    <text x="0" y="72" fill="#f5f7fa" font-size="68" font-weight="700" letter-spacing="-3">gitfudge<tspan fill="#b8ff5c">_</tspan></text>
    <text x="2" y="121" fill="#aab2c0" font-size="22">Gen-AI + full-stack engineer</text>
    <text x="2" y="171" fill="#737b8c" font-size="18">$ procrastinating --into production</text>
  </g>

  <g transform="translate(845 142)" fill="none" stroke="#b8ff5c" stroke-linecap="round">
